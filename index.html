<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Page Not Found</title>
  <link rel="icon" href="/x.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/gate.css">
  <script src="/gate.js" defer></script>
</head>
<body>
  <main class="notfound" id="notfound">
    <svg class="mark" id="mark" viewBox="0 0 200 200" role="img" aria-label="X">
      <path d="M40 40 L160 160 M160 40 L40 160" stroke="#e5232f" stroke-width="34" stroke-linecap="round" fill="none"/>
    </svg>
    <h1>Page Not Found</h1>
  </main>

  <section class="term" id="term" hidden aria-label="Terminal">
    <div class="term-bar" id="term-bar">
      <button class="dot dot-close" id="term-close" type="button" aria-label="Close"></button>
      <button class="dot dot-min" id="term-min" type="button" aria-label="Minimize"></button>
      <button class="dot dot-max" id="term-max" type="button" aria-label="Zoom"></button>
      <span class="term-title" id="term-title">guest — -zsh — 80×24</span>
    </div>
    <div class="term-body" id="term-body">
      <div id="term-log"></div>
      <div class="term-line" id="term-line"><span id="term-prompt"></span><span id="term-before"></span><span class="cursor" id="term-cursor"> </span><span id="term-after"></span><input id="term-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Terminal input"></div>
    </div>
    <span class="term-measure" id="term-measure" aria-hidden="true">0000000000</span>
  </section>

  <main class="inside" id="inside" hidden>
    <p class="inside-tag">v0x5l3b</p>
    <h1>You're in.</h1>
    <p>The new site is being built. Check back soon.</p>
    <button type="button" id="lock">Lock</button>
  </main>
</body>
</html>
