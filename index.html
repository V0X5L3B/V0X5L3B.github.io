<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Page Not Found</title>
  <link rel="icon" href="/stop.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/gate.css">
  <script src="/gate.js" defer></script>
</head>
<body>
  <main class="notfound" id="notfound">
    <svg class="stop" id="stop" viewBox="0 0 200 200" role="img" aria-label="Stop sign">
      <polygon points="58.6,0 141.4,0 200,58.6 200,141.4 141.4,200 58.6,200 0,141.4 0,58.6" fill="#fff"/>
      <polygon points="61.5,7 138.5,7 193,61.5 193,138.5 138.5,193 61.5,193 7,138.5 7,61.5" fill="#c8102e"/>
      <polygon points="64.4,14 135.6,14 186,64.4 186,135.6 135.6,186 64.4,186 14,135.6 14,64.4" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="100" y="100" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="1">STOP</text>
    </svg>
    <h1>Page Not Found</h1>
  </main>

  <section class="term" id="term" hidden aria-label="Terminal">
    <div class="term-bar">
      <button class="dot dot-close" id="term-close" type="button" aria-label="Close terminal"></button>
      <span class="dot dot-min"></span>
      <span class="dot dot-max"></span>
      <span class="term-title" id="term-title">guest — -zsh — 80×24</span>
    </div>
    <div class="term-body" id="term-body">
      <div id="term-log"></div>
      <form class="term-line" id="term-form" autocomplete="off"><span id="term-prompt"></span><span id="term-typed"></span><span class="cursor" id="term-cursor"></span><input id="term-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Terminal input"></form>
    </div>
  </section>

  <main class="inside" id="inside" hidden>
    <p class="inside-tag">v0x5l3b</p>
    <h1>You're in.</h1>
    <p>The new site is being built. Check back soon.</p>
    <button type="button" id="lock">Lock</button>
  </main>
</body>
</html>
